<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشوراتي (Manchorati) - الموقع الرسمي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0B101B;
            color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #111827;
            border: 1px solid #1F2937;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);
            color: #FFFFFF;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        p {
            color: #94A3B8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 100%);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #1E293B;
            color: #E2E8F0;
            border: 1px solid #334155;
        }
        .btn-secondary:hover {
            background: #273548;
        }
        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #64748B;
        }
        .footer a {
            color: #0EA5E9;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Official Developer Portal</div>
        <h1>منشوراتي — Manchorati</h1>
        <p>المنصة الأدبية الرائدة التي تجمع بين سحر الكلمة وإبداع التصميم. أنشئ، صمم، وشارك اقتباساتك وفيديوهاتك بكل احترافية.</p>
        
        <div class="btn-group">
            <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.manchorati.www" target="_blank">تحميل من Google Play</a>
            <a class="btn btn-secondary" href="https://hananemohamedinfo-dotcom.github.io/manchorati/" target="_blank">سياسة الخصوصية (Privacy Policy)</a>
            <a class="btn btn-secondary" href="app-ads.txt" target="_blank">ملف التحقق (app-ads.txt)</a>
        </div>
        
        <div class="footer">
            مطور بواسطة <strong>X4P</strong> • <a href="mailto:hananemohamed.info@gmail.com">hananemohamed.info@gmail.com</a>
        </div>
    </div>
</body>
</html>
